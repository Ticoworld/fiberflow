services:
  fiber:
    image: nervos/fiber:${FIBER_VERSION:-0.9.0-rc3}
    container_name: fiberflow
    restart: unless-stopped
    env_file: .env
    ports:
      - "8228:8228"
      - "${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}"
    volumes:
      - ./data:/fiber

  gateway:
    build: ./server
    container_name: fiberflow-api
    restart: unless-stopped
    network_mode: "service:fiber"
    depends_on:
      - fiber
    env_file: server/.env
    environment:
      PORT: ${GATEWAY_PORT:-3000}
      FIBER_RPC_URL: http://127.0.0.1:8227
      FIBER_NETWORK: ${FIBER_NETWORK:-testnet}
